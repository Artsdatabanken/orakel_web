# Build the Docker image, push to DockerHub, restart the production App Service.
# The API token is NOT baked in at build time — the container injects it at
# startup from the AI_TOKEN env var (App Service app setting → Key Vault
# reference, resolved via the App Service's managed identity).

trigger:
- main

resources:
- repo: self

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        containerRegistry: 'DockerHub'
        repository: 'artsdatabanken/orakel-web'
        command: 'build'
        Dockerfile: '**/Dockerfile'
        tags: 'latest'
    - task: Docker@2
      inputs:
        containerRegistry: 'DockerHub'
        repository: 'artsdatabanken/orakel-web'
        command: 'push'
        tags: 'latest'
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'prod-deploy-code'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: 'az webapp restart --name adb-prod-orakel-as --resource-group adb-prod-orakel-rg'
